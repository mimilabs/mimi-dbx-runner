[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mimi-dbx-runner"
version = "0.2.0"
authors = [
  { name="Yubin Park", email="yubin.park@mimilabs.ai" },
]
description = "CLI tool to run Databricks notebooks from local git repos"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]
dependencies = [
    "databricks-sdk>=0.20.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
dbx-run = "mimi_dbx_runner.cli:main"

[project.urls]
Homepage = "https://github.com/mimilabs/mimi-dbx-runner"
Issues = "https://github.com/mimilabs/mimi-dbx-runner/issues"

[tool.hatch.build]
packages = ["src/mimi_dbx_runner"]
